name: Publish WeakAuras-CoA v1.0.1
on:
  push:
    branches: [main]
    paths: ['source-chunks/**']
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'Stage WeakAuras-CoA v1.0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild ZIP, extract source, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/weakauras-source
          cat source-chunks/*.b64 | base64 -d > /tmp/weakauras-source/input.zip
          unzip -t /tmp/weakauras-source/input.zip
          unzip -q /tmp/weakauras-source/input.zip -d /tmp/weakauras-source/extracted
          for folder in WeakAuras WeakAurasArchive WeakAurasModelPaths WeakAurasOptions WeakAurasStopMotion WeakAurasTemplates; do
            test -d "/tmp/weakauras-source/extracted/$folder"
            cp -a "/tmp/weakauras-source/extracted/$folder" .
          done
          cp /tmp/weakauras-source/input.zip WeakAuras-CoA-v1.0.1.zip
          rm -rf source-chunks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract WeakAuras-CoA v1.0.1 addon source"
          git push origin HEAD:main
          gh release create v1.0.1 WeakAuras-CoA-v1.0.1.zip --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "WeakAuras-CoA v1.0.1" --prerelease --notes-file RELEASE-NOTES.md
