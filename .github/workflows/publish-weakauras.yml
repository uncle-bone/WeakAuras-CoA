name: Build and publish WeakAuras-CoA
on:
  push:
    branches: [main]
    paths: ['.release.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weakauras-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate, package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, zipfile, os, re
          root=pathlib.Path('.')
          cfg=json.loads((root/'.release.json').read_text())
          version=cfg['version']
          assert re.fullmatch(r'v[0-9]+(?:\.[0-9]+)+', version)
          folders=cfg['folders']
          assert len(folders)==6 and len(set(folders))==6
          for folder in folders:
              assert re.fullmatch(r'[A-Za-z0-9_-]+',folder)
              assert (root/folder).is_dir()
              # Validate only the active WoW 3.3.5a TOC; other flavor TOCs are upstream artifacts.
              toc=root/folder/(folder+'.toc')
              assert toc.is_file(), str(toc)
              for line in toc.read_text(encoding='utf-8-sig').splitlines():
                  line=line.strip()
                  if not line or line.startswith('#'): continue
                  target=toc.parent/line.replace('\\','/')
                  assert target.is_file(),str(target)
          assert 'local versionString = "'+version[1:]+'"' in (root/'WeakAuras/Init.lua').read_text()
          assert '## Version: '+version[1:] in (root/'WeakAuras/WeakAuras.toc').read_text()
          output=root/('WeakAuras-CoA-'+version+'.zip')
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED) as z:
              for folder in folders:
                  for p in sorted((root/folder).rglob('*')):
                      if p.is_file(): z.write(p,p.as_posix())
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              assert len(z.namelist())>100
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('RELEASE_VERSION='+version+'\n')
              f.write('RELEASE_ASSET='+str(output)+'\n')
          PY
          RELEASE_VERSION="$(python3 -c 'import json; print(json.load(open(".release.json"))["version"])')"
          RELEASE_ASSET="WeakAuras-CoA-${RELEASE_VERSION}.zip"
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite"
            exit 1
          fi
          gh release create "$RELEASE_VERSION" "$RELEASE_ASSET" --target "$GITHUB_SHA" --title "WeakAuras-CoA $RELEASE_VERSION" --notes-file RELEASE-NOTES.md
